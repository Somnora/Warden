[project]
name = "warden"
version = "0.2.3"
description = "A governed control plane for agent fleets that operate real GPU infrastructure on Google Cloud."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # Google Agent Framework (hackathon requirement 2)
    # Keep the deployed ADK runtime on the tested 2.7 line for demo stability.
    "google-adk>=2.7.1,<2.8",
    # Gemini Flash via Google GenAI / ADK (default: gemini-3.5-flash)
    "google-genai>=2.12",
    # Google Cloud infrastructure (hackathon requirement 3)
    "google-cloud-firestore>=2.19",
    "google-cloud-tasks>=2.18",
    "google-cloud-asset>=3.30",
    "google-cloud-securitycenter>=1.37",
    "google-cloud-bigquery>=3.35",
    "google-cloud-storage>=3.2",
    "google-cloud-compute>=1.39",
    # Required by google.adk.telemetry.google_cloud for Cloud Trace export.
    "opentelemetry-exporter-otlp-proto-http>=1.42,<2",
    # ADK 2.7.x binds the MCP 1.x session API. MCP SDK 2.0.0 relocated
    # mcp.shared.session.ProgressFnT and McpToolset fails to import.
    "mcp>=1.29,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.4"]

[project.scripts]
warden = "warden.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pyinstaller>=6.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warden"]
