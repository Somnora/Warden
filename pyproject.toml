[project]
name = "warden"
version = "0.2.2"
description = "A governed control plane for agent fleets that operate real GPU infrastructure on Google Cloud."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # Google Agent Framework (hackathon requirement 2)
    "google-adk>=2.7.1",
    # Gemini 3.7 Flash via Google GenAI / ADK
    "google-genai>=2.12",
    # Google Cloud infrastructure (hackathon requirement 3)
    "google-cloud-firestore>=2.19",
    "google-cloud-pubsub>=2.23",
    "google-cloud-tasks>=2.18",
    "google-cloud-compute>=1.19",
    # ADK 2.7.x binds the MCP 1.x session API. MCP SDK 2.0.0 relocated
    # mcp.shared.session.ProgressFnT and McpToolset fails to import.
    "mcp>=1.29,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.4"]

[project.scripts]
warden = "warden.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pyinstaller>=6.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["warden"]
