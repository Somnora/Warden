# Warden fleet policy.
#
# This file is the whole contract. An agent in this fleet cannot reach
# infrastructure except through a rule written here. There is no implicit
# allow: an action with no matching rule is denied and logged as UNGOVERNED.

version: 1
fleet: warden-demo

# Hard ceilings evaluated against the live ledger before every spending action.
budget:
  max_usd_per_run: 25.00
  max_usd_per_day: 100.00
  max_concurrent_instances: 2
  # Every launch must carry a teardown deadline. No exceptions.
  require_max_lifetime_minutes: true
  max_lifetime_ceiling_minutes: 180

# Enterprise approval hierarchy. A normal governed action needs one distinct
# approver; irreversible/high-blast-radius cluster actions require two senior
# approvers. The requester can never vote on their own action.
approval:
  default:
    required_approvals: 1
    minimum_role: approver
    require_separation_from_requester: true
  tools:
    launch_cluster:
      required_approvals: 2
      minimum_role: senior_approver
    terminate_cluster:
      required_approvals: 2
      minimum_role: senior_approver
    delete_template:
      required_approvals: 2
      minimum_role: senior_approver

# Independent of whatever the model writes in estimated_usd.
# Quote = MACHINE_HOURLY_RATES[machine] * (max_lifetime_minutes / 60).
# These YAML figures are documentation; engine.py is authoritative.
rates:
  machine_usd_per_hour:
    g2-standard-8: 0.85
    g2-standard-12: 1.25
    a2-highgpu-1g: 3.67
    a2-megagpu-16g: 58.72

# Where compute is allowed to exist.
placement:
  allowed_providers: [gcp]
  allowed_regions:
    - us-west1
    - us-central1
  allowed_machine_types:
    - a2-highgpu-1g
    - a2-megagpu-16g
    - g2-standard-8
    - g2-standard-12

# Per-tool disposition (All 47 Manifold MCP tools governed):
#   allow    - execute, record to ledger
#   approve  - suspend, require a human decision, then record both
#   deny     - refuse, record the attempt
tools:
  # ADK orchestration only. The receiving agent's provider tools still pass
  # through this same runner-level WardenPlugin before they can execute.
  transfer_to_agent:            allow

  # -- Onboarding & Documentation (Free / Read-Only) --
  get_skill:                   allow
  get_work_log:                allow

  # -- Observation & Discovery (Free / Read-Only) --
  list_instances:              allow
  list_launch_options:         allow
  get_launch_status:           allow
  wait_for_launch:             allow
  list_templates:              allow
  get_job_status:              allow
  get_job_logs:                allow
  stream_job_logs:             allow
  stream_task_events:          allow
  list_filesystems:            allow
  list_volumes:                allow
  list_persistent_files:       allow
  get_spend:                   allow
  get_spend_breakdown:         allow
  list_clusters:               allow
  get_cluster_details:         allow
  list_local_subagent_models:  allow
  get_swarm_status:            allow
  get_pending_approvals:       allow
  get_agent_context:           allow
  list_research_keys:          allow

  # -- Governed Execution & File Ops --
  # Shell/job tools require a ticket unless the command matches the
  # read-only inspection allowlist in engine.SAFE_READONLY_COMMANDS.
  run_command:                 approve
  run_job:                     approve
  run_detached:                approve
  detached_status:             allow
  generate_training_config:    allow
  upload_file:                 allow
  download_file:               allow
  sync_outputs:                allow
  agent_handshake:             allow
  update_agent_context:        allow
  dispatch_local_subagent:     approve

  # -- Spending & Provisioning (Human Sign-Off Required) --
  launch_gpu:                  approve
  launch_cluster:              approve
  create_filesystem:           approve
  save_template:               approve
  set_keep_alive:              approve
  register_endpoint:           approve

  # -- Destructive Actions (Human Sign-Off Required) --
  terminate_instance:          approve
  terminate_cluster:           approve
  delete_template:             approve

  # -- Enterprise Prohibited / Zero-Trust Vault Protection --
  # Under NO prompt or agent role may an autonomous agent execute these:
  set_research_key:            deny
  get_research_key:            deny
  deregister_endpoint:         deny
  decide_approval:             deny

# Data handling & Egress DLP Redaction
egress:
  redact_patterns:
    - name: gcp_service_account_key
      pattern: '"private_key"\s*:\s*"(?:\\.|[^"\\])*"'
    # Complete PEM blocks are removed as a unit so key material cannot remain
    # after only the header has been replaced. The second rule catches a
    # truncated block returned by a failed command or exception.
    - name: private_key_pem
      pattern: '(?s)-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----.*?-----END (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
    - name: private_key_pem_truncated
      pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----[A-Za-z0-9+/=\r\n]{3,}'
    - name: private_key_pem_header
      pattern: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
    - name: bearer_token
      pattern: '(?i)bearer\s+[A-Za-z0-9._\-]{20,}'
    - name: oauth_access_token
      pattern: '(?<![A-Za-z0-9._\-])ya29\.[A-Za-z0-9._\-]{20,}'
    - name: oauth_client_secret
      pattern: '(?<![A-Za-z0-9_\-])GOCSPX-[A-Za-z0-9_\-]{20,}'
    - name: jwt_token
      pattern: '(?<![A-Za-z0-9_\-])eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]{8,}'
    - name: gcp_api_key
      pattern: 'AIza[0-9A-Za-z_\-]{35}'
