name: Desktop release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-arm64
            runner: macos-14
            command: bash scripts/build_macos_dmg.sh
            artifact: dist/Warden-macOS-arm64.dmg
          - name: Windows
            runner: windows-latest
            command: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1
            artifact: dist/Warden.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create isolated build environment
        run: python -m venv .venv
      - name: Build desktop package
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: Warden-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
      - name: Attach assets to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
